<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dona Mônica</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="caixa">
        <h1>Descubra a idade do terceiro filho de dona Mônica</h1>
        <label for="idadeMae">Idade da mãe:</label>
        <input type="number" id="idadeMae">
        <label for="idadeFilho1">Idade do primeiro filho:</label>
        <input type="number" id="idadeFilho1">
        <label for="idadeFilho2">Idade do segundo filho:</label>
        <input type="number" id="idadeFilho2">
        <button id="calcular">Saber idade do terceiro filho</button>
        <p id="resultado"></p>
    </div>
    <script src="script.js"></script>
</body>

</html>
